<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>witowwito</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-card: #2a2a2a;
            --bg-card-light: #363636;
            --bg-input: #444444;
            --text-main: #f0f0f0;
            --text-sub: #b0b0b0;
            --accent-red: #8b0000;
            --accent-red-hover: #a00000;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        .app-container {
            width: 920px;
            height: 620px;
            position: relative;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            font-family: Arial, sans-serif;
            border: 3px solid #555;
            border-radius: 8px;
            background-color: var(--bg-input);
            color: #fff;
            margin-top: 5px;
            box-sizing: border-box;
            outline: none;
        }

        .action-btn {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 22px;
            font-family: inherit;
            background-color: var(--bg-card-light);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover { background-color: #555; }

        .btn-voltar {
            background-color: var(--bg-card-light);
            color: white;
            border: none;
            padding: 8px 18px;
            cursor: pointer;
            font-family: inherit;
            font-size: 20px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .btn-voltar:hover { background-color: #555; }

        .white-circle-avatar {
            width: 65px;
            height: 65px;
            min-width: 65px;
            min-height: 65px;
            background-color: #ffffff;
            border-radius: 50%;
            border: 3px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .login-title-box {
            background-color: var(--bg-card-light);
            color: var(--text-main);
            padding: 12px 35px;
            border-radius: 10px;
            font-size: 26px;
            margin-bottom: 25px;
        }
        .login-box {
            background-color: var(--bg-card);
            padding: 35px 50px;
            border-radius: 12px;
            width: 480px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .login-box label {
            display: block;
            font-size: 26px;
            margin-top: 15px;
            color: var(--text-sub);
            text-align: left;
        }

        #app-screen { display: none; height: 100%; }
        .sidebar {
            background-color: var(--bg-card);
            width: 80px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 25px;
            box-sizing: border-box;
        }
        .add-btn {
            width: 60px;
            height: 60px;
            border: 4px solid var(--text-sub);
            border-radius: 50%;
            background-color: transparent;
            font-size: 50px;
            color: var(--text-sub);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            line-height: 0;
            transition: 0.2s;
        }
        .add-btn:hover { color: #fff; border-color: #fff; transform: scale(1.05); }

        .main-content {
            background-color: var(--bg-card);
            margin-left: 100px;
            width: 610px;
            height: 100%;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .main-content h1 { text-align: center; margin-top: 0; font-size: 34px; letter-spacing: 1px; }

        .video-list { display: flex; flex-direction: column; gap: 15px; }
        .empty-message {
            text-align: center;
            color: var(--text-sub);
            font-size: 22px;
            margin-top: 80px;
        }
        .video-item {
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            background-color: var(--bg-card-light);
            padding: 12px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .video-item:hover { background-color: #484848; }

        .thumb {
            width: 170px;
            height: 95px;
            border: 3px solid #666;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            text-align: center;
            padding: 5px;
            color: var(--text-sub);
            background-color: #222;
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
        }
        .video-title { font-size: 26px; color: var(--text-main); }

        .right-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 190px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }
        .logo { font-size: 38px; color: var(--text-main); margin-right: 15px; margin-top: 10px; letter-spacing: 1px; }

        .user-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 15px;
            margin-bottom: 20px;
            cursor: pointer;
            position: relative;
        }
        .user-name-tag {
            background-color: var(--bg-card-light);
            color: var(--text-main);
            padding: 4px 12px;
            margin-top: 8px;
            font-size: 18px;
            border-radius: 5px;
        }

        #upload-screen {
            display: none;
            height: 100%;
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            flex-direction: column;
            overflow-y: auto;
        }
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        .file-picker-box {
            background-color: var(--bg-card-light);
            border: 4px solid #111;
            border-radius: 12px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-main);
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
        }
        .input-styled-box {
            background-color: var(--bg-card-light);
            border: 4px solid #111;
            border-radius: 12px;
            margin-top: 10px;
            padding: 5px;
        }
        .input-styled-box input, .input-styled-box textarea {
            background: transparent;
            border: none;
            outline: none;
            font-size: 20px;
            color: #ccc;
        }

        #video-screen { display: none; height: 100%; flex-direction: column; }
        .video-player-box {
            width: 100%;
            height: 360px;
            background-color: #000;
            border-radius: 12px;
            border: 3px solid #555;
            overflow: hidden;
        }
        .video-player-box video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="app-container">

        <div id="login-screen">
            <div class="login-title-box">crie seu canal primeiro</div>
            <div class="login-box">
                <label for="username">nome do canal</label>
                <input type="text" id="username">
                <label for="password">senha</label>
                <input type="password" id="password">
                <button class="action-btn" onclick="fazerLogin()">Entrar</button>
            </div>
        </div>

        <div id="app-screen">
            <div class="sidebar">
                <div class="add-btn" onclick="abrirEditorUpload()">+</div>
            </div>

            <div class="main-content">
                <h1>pagina inicial</h1>
                <div class="video-list" id="feed-videos"></div>
            </div>

            <div class="right-panel">
                <div class="logo">witowwito</div>
                <div class="user-profile">
                    <div class="white-circle-avatar" id="main-user-avatar"></div>
                    <div class="user-name-tag" id="display-username">name user</div>
                </div>
            </div>
        </div>

        <div id="upload-screen">
            <button class="btn-voltar" onclick="voltarParaFeed()" style="width: 100px;">Voltar</button>
            
            <input type="file" id="thumb-input" accept="image/*" style="display: none;">
            <input type="file" id="video-file-input" accept="video/*" style="display: none;">

            <div class="upload-grid">
                <div class="file-picker-box" id="thumb-preview" onclick="document.getElementById('thumb-input').click()">
                    Clique para escolher a Capa (Thumb)
                </div>
                <div class="file-picker-box" id="video-file-label" onclick="document.getElementById('video-file-input').click()">
                    Clique para escolher o Arquivo de Vídeo (MP4)
                </div>
            </div>

            <div class="input-styled-box">
                <input type="text" id="upload-title" placeholder="Título do vídeo">
            </div>

            <div class="input-styled-box">
                <textarea id="upload-desc" rows="2" placeholder="Descrição do vídeo"></textarea>
            </div>

            <button class="action-btn" id="btn-pub" onclick="publicarVideo()" style="margin-top: 15px;">Publicar Vídeo na Nuvem</button>
        </div>

        <div id="video-screen">
            <button class="btn-voltar" onclick="voltarParaFeed()" style="width: 100px; margin-bottom: 10px;">Voltar</button>
            <div class="video-player-box">
                <video id="player-real" controls autoplay></video>
            </div>
            <h2 id="watch-title" style="font-size: 30px; margin: 10px 0 5px 0;"></h2>
            <div style="background-color: var(--bg-card); padding: 15px; border-radius: 10px;">
                <h3 style="margin: 0; color: var(--text-sub);">descrição</h3>
                <p id="watch-desc" style="font-family: Arial; margin-top: 5px;"></p>
            </div>
        </div>

    </div>

    <script>
     
        const SUPABASE_URL = "https://jkdrzqbdabdcilgdygdp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_SyKaRjAViq6fCiLYVp7IUQ_6kbt_s9W";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let canalAtual = JSON.parse(localStorage.getItem('witowwito_user')) || null;

        window.onload = function() {
            if (canalAtual) entrarNoApp();
        };

        function esconderTodasTelas() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('upload-screen').style.display = 'none';
            document.getElementById('video-screen').style.display = 'none';
        }

        function fazerLogin() {
            const nome = document.getElementById('username').value.trim();
            if (!nome) return alert("Digite o nome do canal!");
            canalAtual = { nome: nome };
            localStorage.setItem('witowwito_user', JSON.stringify(canalAtual));
            entrarNoApp();
        }

        function entrarNoApp() {
            esconderTodasTelas();
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('display-username').innerText = canalAtual.nome;
            renderizarFeed();
        }

        function abrirEditorUpload() {
            esconderTodasTelas();
            document.getElementById('upload-screen').style.display = 'flex';
        }

        document.getElementById('thumb-input').addEventListener('change', e => {
            if(e.target.files[0]) document.getElementById('thumb-preview').innerText = "Capa selecionada: " + e.target.files[0].name;
        });

        document.getElementById('video-file-input').addEventListener('change', e => {
            if(e.target.files[0]) document.getElementById('video-file-label').innerText = "Vídeo selecionado: " + e.target.files[0].name;
        });

        async function publicarVideo() {
            const titulo = document.getElementById('upload-title').value.trim();
            const desc = document.getElementById('upload-desc').value.trim();
            const videoFile = document.getElementById('video-file-input').files[0];
            const thumbFile = document.getElementById('thumb-input').files[0];

            if (!videoFile || !titulo) return alert("Selecione um arquivo de vídeo e preencha o título!");

            const btn = document.getElementById('btn-pub');
            btn.innerText = "Enviando vídeo para a nuvem... aguarde!";
            btn.disabled = true;

            try {
                // 1. Upload do vídeo para o Storage
                const videoName = `${Date.now()}_${videoFile.name}`;
                const { data: vData, error: vErr } = await _supabase.storage.from('videos').upload(videoName, videoFile);
                if (vErr) throw vErr;
                
                const videoUrl = _supabase.storage.from('videos').getPublicUrl(videoName).data.publicUrl;

                // 2. Upload da capa (se tiver)
                let thumbUrl = "";
                if (thumbFile) {
                    const thumbName = `thumb_${Date.now()}_${thumbFile.name}`;
                    await _supabase.storage.from('videos').upload(thumbName, thumbFile);
                    thumbUrl = _supabase.storage.from('videos').getPublicUrl(thumbName).data.publicUrl;
                }

                // 3. Salvar informações no Banco de Dados
                const { error: dbErr } = await _supabase.from('videos').insert([{
                    titulo: titulo,
                    descricao: desc,
                    autor: canalAtual.nome,
                    thumb_url: thumbUrl,
                    video_url: videoUrl
                }]);

                if (dbErr) throw dbErr;

                alert("Vídeo publicado com sucesso!");
                voltarParaFeed();
            } catch (err) {
                alert("Erro ao publicar vídeo: " + err.message);
            } finally {
                btn.innerText = "Publicar Vídeo na Nuvem";
                btn.disabled = false;
            }
        }

        async function renderizarFeed() {
            const feed = document.getElementById('feed-videos');
            feed.innerHTML = "<p style='text-align:center;'>Carregando vídeos da nuvem...</p>";

            const { data: videos, error } = await _supabase.from('videos').select('*').order('created_at', { ascending: false });

            feed.innerHTML = "";
            if (error || !videos || videos.length === 0) {
                feed.innerHTML = `<div class="empty-message">Nenhum vídeo publicado ainda. Seja o primeiro!</div>`;
                return;
            }

            videos.forEach(v => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.onclick = () => abrirVideoPlayer(v);
                
                const thumbStyle = v.thumb_url ? `style="background-image: url('${v.thumb_url}')"` : "";
                const thumbText = v.thumb_url ? "" : "sem capa";

                item.innerHTML = `
                    <div class="thumb" ${thumbStyle}>${thumbText}</div>
                    <div>
                        <div class="video-title">${v.titulo}</div>
                        <div style="color:var(--text-sub); font-family:Arial;">Por: ${v.autor}</div>
                    </div>
                `;
                feed.appendChild(item);
            });
        }

        function abrirVideoPlayer(video) {
            esconderTodasTelas();
            document.getElementById('video-screen').style.display = 'flex';
            const player = document.getElementById('player-real');
            player.src = video.video_url;
            document.getElementById('watch-title').innerText = video.titulo;
            document.getElementById('watch-desc').innerText = video.descricao;
        }

        function voltarParaFeed() {
            document.getElementById('player-real').pause();
            document.getElementById('player-real').src = "";
            entrarNoApp();
        }
    </script>
</body>
</html>
